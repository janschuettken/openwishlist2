<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Open Wishlist</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Open Wishlist – die App für deine Wünsche." />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wishlist" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="app-icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Theme vor dem ersten Rendern setzen, damit nichts aufblitzt
      try {
        var t = localStorage.getItem('theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Bitte aktiviere JavaScript, um Open Wishlist zu nutzen.</noscript>
  </body>
</html>
